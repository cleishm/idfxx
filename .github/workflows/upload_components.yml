name: Upload Components

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Validate uploads without publishing (verifies OIDC + trusted uploader)'
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Discover components in topological order
        id: discover
        run: |
          list=$(python3 scripts/component-order.py --paths)
          echo "list<<EOF" >> "$GITHUB_OUTPUT"
          echo "$list" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      # The registry processes uploads asynchronously and the upload tool gives up
      # polling early under load, reporting "an unknown error happened during
      # processing" for uploads that in fact succeed moments later. On a real
      # upload the verify step below is the authority on whether the job passed,
      # so a false failure here is tolerated. In dry-run mode nothing is published
      # and there is nothing to verify, so this step stays fatal.
      - name: Upload components to ESP Component Registry
        id: upload
        continue-on-error: ${{ !inputs.dry_run }}
        uses: espressif/upload-components-ci-action@v2
        with:
          namespace: cleishm
          components: ${{ steps.discover.outputs.list }}
          dry_run: ${{ inputs.dry_run || '' }}

      - name: Verify components reached the registry
        if: ${{ !inputs.dry_run }}
        run: |
          echo "Upload step outcome: ${{ steps.upload.outcome }}"
          python3 scripts/verify-registry.py --namespace cleishm
