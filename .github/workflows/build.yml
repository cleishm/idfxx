name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# A new push to a PR supersedes its in-flight run, and a new push to main
# supersedes main's: the newest main commit contains every earlier one, so after
# a burst of merges only it is built (docs.yml deploys from the latest passing
# run). Manual runs each get their own group and are never replaced.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || (github.event_name == 'push' && github.ref) || github.run_id }}
  cancel-in-progress: true

jobs:
  # Decides whether this run can skip the build. all-checks records each tree
  # that passes on a pull request, and a push to main whose tree matches one of
  # those (the PR merged without main moving underneath it) would only rebuild
  # identical sources, so it skips. Trees are compared rather than commits
  # because the commit that lands is never the one the PR tested, even when
  # their contents are identical. Any other event, or a lookup that fails,
  # builds.
  tested:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      tree: ${{ steps.check.outputs.tree }}
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - name: Look for a passing run of this tree
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          tree=$(gh api "repos/$REPO/git/commits/$SHA" --jq .tree.sha) || tree=
          skip=false
          if [ "$EVENT" = push ] && [ -n "$tree" ]; then
            # Records from fork PRs are ignored: a fork's run uses the fork's
            # copy of this workflow, so its record proves nothing.
            match=$(gh api "repos/$REPO/actions/artifacts?name=tested-tree-$tree" \
              --jq '[.artifacts[] | select(.expired | not)
                     | select(.workflow_run.head_repository_id == .workflow_run.repository_id)][0] // empty
                    | "\(.id) \(.workflow_run.id) \(.workflow_run.head_branch)"') || match=
            if [ -n "$match" ]; then
              skip=true
              read -r artifact_id run_id head_branch <<< "$match"
              # The record holds the number of the PR that passed. If it can't
              # be read, or holds anything other than a number, the notice
              # names the branch instead.
              pr=
              if gh api "repos/$REPO/actions/artifacts/$artifact_id/zip" > "$RUNNER_TEMP/record.zip"; then
                pr=$(unzip -p "$RUNNER_TEMP/record.zip" tested-tree) || pr=
              fi
              case "$pr" in *[!0-9]*) pr= ;; esac
              source="${pr:+PR #$pr}"
              source="${source:-branch $head_branch}"
              run_url="$GITHUB_SERVER_URL/$REPO/actions/runs/$run_id"
              echo "::notice title=Build skipped::tree $tree already passed in $source ($run_url)"
              echo "Build skipped: this tree already passed in $source ([run]($run_url))." >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          echo "tree: ${tree:-unknown}, skip: $skip"
          echo "tree=$tree" >> "$GITHUB_OUTPUT"
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

  format-check:
    needs: tested
    if: needs.tested.outputs.skip != 'true'
    runs-on: ubuntu-latest
    container: espressif/idf:v6.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ESP-IDF tools
        run: |
          . $IDF_PATH/export.sh
          idf_tools.py install esp-clang
          idf_tools.py export

      - name: Configure and check formatting
        run: |
          . $IDF_PATH/export.sh
          clang-format --version
          idf.py reconfigure
          cmake --build build --target format-check

  build:
    needs: tested
    if: needs.tested.outputs.skip != 'true'
    runs-on: ubuntu-latest
    container: espressif/idf:v6.1
    strategy:
      fail-fast: false
      matrix:
        target: [esp32s3, esp32c6, esp32p4]
        config:
          - name: with-exceptions
            defaults: sdkconfig.defaults
          - name: no-exceptions
            defaults: "sdkconfig.defaults;sdkconfig.no-exceptions"
          - name: no-ipv6
            defaults: "sdkconfig.defaults;sdkconfig.no-ipv6"
    name: build (${{ matrix.target }}, ${{ matrix.config.name }})
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: |
          . $IDF_PATH/export.sh
          idf.py -D SDKCONFIG_DEFAULTS="${{ matrix.config.defaults }}" set-target ${{ matrix.target }}
          idf.py build

  # Early-warning canary: builds against the moving release/v6.1 branch tip to
  # surface upstream ESP-IDF changes before they land in a tagged point release.
  # Every other job pins to espressif/idf:v6.1; this one is allowed to fail so
  # unreleased upstream regressions flag a warning without blocking PRs.
  build-canary:
    needs: tested
    if: needs.tested.outputs.skip != 'true'
    runs-on: ubuntu-latest
    container: espressif/idf:release-v6.1
    continue-on-error: true
    name: build (canary-release-v6.1)
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: |
          . $IDF_PATH/export.sh
          idf.py set-target esp32s3
          idf.py build

  build-compat:
    needs: tested
    if: needs.tested.outputs.skip != 'true'
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5
    name: build (compat-v5.5)
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: |
          . $IDF_PATH/export.sh
          idf.py set-target esp32s3
          cp sdkconfig.defaults sdkconfig
          idf.py reconfigure
          idf.py build

  discover-examples:
    needs: tested
    if: needs.tested.outputs.skip != 'true'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.find.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find examples
        id: find
        run: |
          examples='[]'
          for dir in components/*/examples/*/; do
            [ -f "${dir}CMakeLists.txt" ] || continue
            component=$(echo "$dir" | cut -d'/' -f2)
            example=$(echo "$dir" | cut -d'/' -f4)
            examples=$(echo "$examples" | jq -c --arg p "$dir" --arg c "$component" --arg e "$example" \
              '. + [{"path": $p, "component": $c, "example": $e}]')
          done
          echo "matrix={\"include\":${examples}}" >> "$GITHUB_OUTPUT"

  # Waits for the main builds so a change that already fails them doesn't also
  # spend a job per example. build-canary is left out, since it may fail.
  build-example:
    needs: [discover-examples, format-check, build, build-compat]
    runs-on: ubuntu-latest
    container: espressif/idf:v6.1
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover-examples.outputs.matrix) }}
    name: example (${{ matrix.component }}/${{ matrix.example }})
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: |
          . $IDF_PATH/export.sh
          cd ${{ matrix.path }}
          idf.py set-target esp32s3
          idf.py build

  qemu-test:
    needs: tested
    if: needs.tested.outputs.skip != 'true'
    runs-on: ubuntu-latest
    container: espressif/idf:v6.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify QEMU Installation
        run: |
          . $IDF_PATH/export.sh
          if ! command -v qemu-system-xtensa &> /dev/null; then
            echo "Installing QEMU for Xtensa..."
            python $IDF_PATH/tools/idf_tools.py install qemu-xtensa
            python $IDF_PATH/tools/idf_tools.py install-python-env
          fi
          qemu-system-xtensa --version

      - name: Build for QEMU
        run: |
          . $IDF_PATH/export.sh
          idf.py set-target esp32s3
          cp sdkconfig.qemu sdkconfig
          idf.py reconfigure
          idf.py build

      - name: Create Flash Image for QEMU
        run: |
          . $IDF_PATH/export.sh
          # Create 4MB flash image from the project's flash_args. A relative -o
          # is resolved against the build directory, so name the target in full.
          idf.py merge-bin --format raw --fill-flash-size 4MB -o "$PWD/qemu_flash.bin"

      - name: Run Tests in QEMU
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          # Run QEMU in background, capture PID, and exit when tests complete or timeout
          mkfifo qemu_pipe
          timeout 300s qemu-system-xtensa \
            -machine esp32s3 \
            -nographic \
            -drive file=qemu_flash.bin,if=mtd,format=raw > qemu_pipe 2>&1 &
          QEMU_PID=$!

          # Read from pipe, log output, and kill QEMU when sentinel is detected
          while IFS= read -r line; do
            echo "$line" | tee -a qemu_output.log
            if [[ "$line" == *"### TESTS COMPLETE ###"* ]]; then
              kill $QEMU_PID 2>/dev/null || true
              break
            fi
          done < qemu_pipe

          wait $QEMU_PID 2>/dev/null || true
          rm -f qemu_pipe

      - name: Parse Test Results
        run: |
          if grep -q "Tests.*Failures.*Ignored" qemu_output.log; then
            SUMMARY=$(grep -o "[0-9]* Tests [0-9]* Failures [0-9]* Ignored" qemu_output.log | tail -1)
            echo "Test Summary: $SUMMARY"

            FAILURES=$(echo "$SUMMARY" | grep -o "[0-9]* Failures" | cut -d' ' -f1)

            if [ "$FAILURES" -eq "0" ]; then
              echo "✅ All tests passed!"
              exit 0
            else
              echo "❌ $FAILURES test(s) failed"
              cat qemu_output.log
              exit 1
            fi
          else
            echo "❌ ERROR: Unity test summary not found in output"
            cat qemu_output.log
            exit 1
          fi

      - name: Upload QEMU Output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-test-output
          path: qemu_output.log

  # Single check to require in branch protection. The example jobs come from a
  # matrix computed at run time, so their check names change whenever examples
  # are added or renamed and cannot be required by name; this job gives every
  # job above one stable name to gate on. build-canary is deliberately absent —
  # it tracks an unreleased branch and is allowed to fail.
  #
  # On a pull request that passes, it also records the tested tree for the
  # tested job above. The record expires after 30 days, after which a merge
  # simply builds again.
  all-checks:
    if: always() && needs.tested.outputs.skip != 'true'
    needs: [tested, format-check, build, build-compat, discover-examples, build-example, qemu-test]
    runs-on: ubuntu-latest
    steps:
      - name: Check that every required job succeeded
        env:
          # always() means this job runs even when a dependency fails, so the
          # results have to be inspected rather than inferred from getting here.
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "::error::a required job did not succeed"
              exit 1
            fi
          done
          echo "all required jobs succeeded"

      - name: Write the tested-tree record
        if: github.event_name == 'pull_request' && needs.tested.outputs.tree != ''
        env:
          PR: ${{ github.event.pull_request.number }}
        run: echo "$PR" > tested-tree

      - name: Record the tree as tested
        if: github.event_name == 'pull_request' && needs.tested.outputs.tree != ''
        uses: actions/upload-artifact@v4
        with:
          name: tested-tree-${{ needs.tested.outputs.tree }}
          path: tested-tree
          retention-days: 30
          overwrite: true
