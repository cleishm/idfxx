version: "0.1.0"
description: "A log in flash that keeps ESP-IDF's warnings and errors, the app's lines and its faults across resets"
url: "https://github.com/cleishm/idfxx/tree/main/components/system/idfxx_persistent_log"
repository: "https://github.com/cleishm/idfxx.git"
license: "Apache-2.0"
dependencies:
  idf: ">=5.5"
  cleishm/idfxx_core:
    version: "^1.3.0"
    public: true
    override_path: ../../core/idfxx_core
  cleishm/idfxx_partition:
    version: "^2.0.0"
    public: true
    override_path: ../../storage/idfxx_partition
  cleishm/idfxx_log:
    version: "^1.1.0"
    public: true
    override_path: ../../core/idfxx_log
  cleishm/idfxx_task:
    version: "^3.0.0"
    override_path: ../../system/idfxx_task
